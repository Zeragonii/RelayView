name: Build RelayView

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: pip install pytest
      - name: Check libmpv migration cleanup
        run: python scripts/cleanup_mpv_migration.py
      - name: Run parser tests
        run: pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    # Publishing a tagged GitHub Release requires write permission.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read application version
        id: version
        shell: powershell
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building RelayView $version"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $expected = "v${{ steps.version.outputs.version }}"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match pyproject version $expected"
          }

      - name: Inject update source
        shell: powershell
        run: |
          @"
          # Generated by GitHub Actions. Do not edit in packaged builds.
          REPOSITORY_URL = "https://github.com/${{ github.repository }}"
          "@ | Set-Content -Encoding UTF8 relayview/build_info.py

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      # A real Qt event-loop check catches native widget construction errors
      # that parser-only tests cannot, before native packaging steps.
      - name: Smoke test Windows Qt grid startup
        shell: powershell
        run: python -m pytest -q tests/test_grid_startup.py tests/test_pan_controls.py

      # Reuse the pinned, checksum-verified libmpv DLL across ordinary builds.
      - name: Restore libmpv runtime
        id: mpv-cache
        uses: actions/cache@v4
        with:
          path: .cache/mpv-runtime
          key: mpv-win64-20261008-36bf3d5290-${{ hashFiles('scripts/prepare_mpv.ps1') }}

      - name: Prepare libmpv runtime (cache miss)
        if: steps.mpv-cache.outputs.cache-hit != 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\prepare_mpv.ps1

      - name: Verify libmpv runtime
        shell: powershell
        run: |
          if (!(Test-Path '.cache\mpv-runtime\libmpv-2.dll')) {
            throw 'libmpv-2.dll not found in runtime cache'
          }

      - name: Smoke test native libmpv C API
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path mpv -Force | Out-Null
          Copy-Item -Path '.cache\mpv-runtime\*.dll' -Destination mpv -Force
          python -m scripts.smoke_mpv
          Remove-Item mpv -Recurse -Force

      # PyInstaller's binary cache is reusable across runner instances; the
      # application itself is still rebuilt from the checked-out source.
      - name: Restore PyInstaller binary cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pyinstaller
          key: pyinstaller-win64-py312-${{ hashFiles('requirements.txt', 'requirements-dev.txt', '.github/workflows/build.yml') }}

      - name: Build lean RelayView application
        shell: powershell
        run: >-
          python -m PyInstaller
          --noconfirm
          --windowed
          --onedir
          --name RelayView
          --icon assets/relayview.ico
          --add-data "assets;assets"
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtWebEngineQuick
          --exclude-module PySide6.QtQml
          --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtQuickWidgets
          --exclude-module PySide6.QtMultimedia
          --exclude-module PySide6.QtMultimediaWidgets
          --exclude-module PySide6.QtBluetooth
          --exclude-module PySide6.QtLocation
          --exclude-module PySide6.QtPositioning
          --exclude-module PySide6.QtSql
          --exclude-module PySide6.QtTest
          main.py

      - name: Bundle cached libmpv runtime
        shell: powershell
        run: |
          Copy-Item -Path ".cache\mpv-runtime" -Destination "dist\RelayView\mpv" -Recurse -Force

      - name: Add notices
        shell: powershell
        run: |
          Copy-Item README.md "dist\RelayView\README.md"
          Copy-Item LICENSE "dist\RelayView\LICENSE"
          Copy-Item THIRD_PARTY_NOTICES.md "dist\RelayView\THIRD_PARTY_NOTICES.md"

      - name: Report unpacked size
        shell: powershell
        run: |
          $bytes = (Get-ChildItem "dist\RelayView" -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("RelayView unpacked size: {0:N1} MB" -f ($bytes / 1MB))

      - name: Install Velopack CLI
        shell: powershell
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Download previous Velopack release for delta generation
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GH_TOKEN

      - name: Create installer and update packages
        shell: powershell
        run: |
          vpk pack `
            --packId RelayView `
            --packVersion "${{ steps.version.outputs.version }}" `
            --packDir "dist\RelayView" `
            --mainExe "RelayView.exe" `
            --packTitle "RelayView" `
            --icon "assets\relayview.ico" `
            --runtime win-x64 `
            --delta BestSpeed

      - name: Upload CI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RelayView-${{ steps.version.outputs.version }}-Windows-x64
          path: Releases/RelayView-win-Setup.exe
          if-no-files-found: error

      - name: Publish Velopack GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vpk upload github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token $env:GH_TOKEN `
            --publish `
            --releaseName "RelayView v${{ steps.version.outputs.version }}" `
            --tag "v${{ steps.version.outputs.version }}"

  # Android is independent of Windows packaging. On branches/PRs it uploads
  # test-only DEBUG APKs; on tags it also creates a signed RELEASE APK.
  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android compile SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - name: Read RelayView version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "ERROR: Tag must match pyproject.toml version v$VERSION" >&2
            exit 1
          fi
      - name: Android JVM unit tests and debug APK
        run: |
          gradle -p android --no-daemon :app:testDebugUnitTest :app:assembleDebug \
            -PrelayviewVersion="${{ steps.version.outputs.version }}" \
            -PrelayviewRepo="${{ github.repository }}"
      - name: Upload debug APK (test-only signing certificate)
        uses: actions/upload-artifact@v4
        with:
          name: RelayView-Android-Debug-${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Require production APK signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          for VAR in KEYSTORE_B64 KS_PASSWORD KS_ALIAS KEY_PASSWORD; do
            if [[ -z "${!VAR}" ]]; then
              echo "Missing Android release signing secret: $VAR" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/relayview-release.keystore"
          chmod 600 "$RUNNER_TEMP/relayview-release.keystore"
      - name: Build signed Android release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELAYVIEW_KEYSTORE: ${{ runner.temp }}/relayview-release.keystore
          RELAYVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELAYVIEW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELAYVIEW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android --no-daemon :app:assembleRelease \
            -PrelayviewVersion="${{ steps.version.outputs.version }}" \
            -PrelayviewRepo="${{ github.repository }}"
          mv android/app/build/outputs/apk/release/app-release.apk \
             "RelayView-Android-v${{ steps.version.outputs.version }}.apk"
      - name: Validate APK release signature
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "RelayView-Android-v${{ steps.version.outputs.version }}.apk"
      - name: Upload signed APK for publisher job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: relayview-android-release-apk
          path: RelayView-Android-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 7

  # Wait until Velopack has created/published the GitHub release. Do not create
  # competing releases from two jobs or alter/remove any Windows installer files.
  publish_android:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: relayview-android-release-apk
          path: out
      - name: Add Android APK and update manifest to the Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          APK="out/RelayView-Android-v${VERSION}.apk"
          test -f "$APK"
          python3 scripts/generate_android_update_manifest.py \
            --apk "$APK" --repo "$REPO" --version "$VERSION" --output out/android-update.json
          gh release view "$TAG" --repo "$REPO" >/dev/null
          gh release upload "$TAG" "$APK" out/android-update.json --repo "$REPO" --clobber
          echo "Published signed Android APK and updater manifest to $REPO/$TAG"
