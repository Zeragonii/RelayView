name: Build RelayView

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: pip install pytest
      - name: Run parser tests
        run: pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read application version
        id: version
        shell: powershell
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building RelayView $version"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $expected = "v${{ steps.version.outputs.version }}"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match pyproject version $expected"
          }

      - name: Inject update source
        shell: powershell
        run: |
          @"
          # Generated by GitHub Actions. Do not edit in packaged builds.
          REPOSITORY_URL = "https://github.com/${{ github.repository }}"
          "@ | Set-Content -Encoding UTF8 relayview/build_info.py

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Install VLC runtime
        shell: powershell
        run: choco install vlc --version=3.0.23 --no-progress -y

      - name: Build lean RelayView application
        shell: powershell
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --onedir
          --name RelayView
          --icon assets/relayview.ico
          --add-data "assets;assets"
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtWebEngineQuick
          --exclude-module PySide6.QtQml
          --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtQuickWidgets
          --exclude-module PySide6.QtMultimedia
          --exclude-module PySide6.QtMultimediaWidgets
          --exclude-module PySide6.QtBluetooth
          --exclude-module PySide6.QtLocation
          --exclude-module PySide6.QtPositioning
          --exclude-module PySide6.QtSql
          --exclude-module PySide6.QtTest
          main.py

      - name: Bundle trimmed VLC
        shell: powershell
        run: |
          .\scripts\trim_vlc.ps1 -Source "C:\Program Files\VideoLAN\VLC" -Destination "dist\RelayView\vlc"

      - name: Add notices
        shell: powershell
        run: |
          Copy-Item README.md "dist\RelayView\README.md"
          Copy-Item LICENSE "dist\RelayView\LICENSE"

      - name: Report unpacked size
        shell: powershell
        run: |
          $bytes = (Get-ChildItem "dist\RelayView" -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("RelayView unpacked size: {0:N1} MB" -f ($bytes / 1MB))

      - name: Install Velopack CLI
        shell: powershell
        run: dotnet tool install -g vpk --version 1.2.158

      - name: Download previous Velopack release for delta generation
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GH_TOKEN

      - name: Create installer and update packages
        shell: powershell
        run: |
          vpk pack `
            --packId RelayView `
            --packVersion "${{ steps.version.outputs.version }}" `
            --packDir "dist\RelayView" `
            --mainExe "RelayView.exe" `
            --packTitle "RelayView" `
            --icon "assets\relayview.ico" `
            --delta BestSize

      - name: Upload CI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RelayView-${{ steps.version.outputs.version }}-Windows-x64
          path: Releases/*
          if-no-files-found: error

      - name: Publish Velopack GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vpk upload github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token $env:GH_TOKEN `
            --publish `
            --releaseName "RelayView v${{ steps.version.outputs.version }}" `
            --tag "v${{ steps.version.outputs.version }}"
