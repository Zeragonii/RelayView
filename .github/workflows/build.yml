name: Build RelayView

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: pip install pytest
      - name: Run parser tests
        run: pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    # Publishing a tagged GitHub Release requires write permission.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read application version
        id: version
        shell: powershell
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building RelayView $version"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $expected = "v${{ steps.version.outputs.version }}"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match pyproject version $expected"
          }

      - name: Inject update source
        shell: powershell
        run: |
          @"
          # Generated by GitHub Actions. Do not edit in packaged builds.
          REPOSITORY_URL = "https://github.com/${{ github.repository }}"
          "@ | Set-Content -Encoding UTF8 relayview/build_info.py

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      # A real Qt event-loop check catches native widget construction errors
      # that parser-only tests cannot, before the expensive VLC/installer steps.
      - name: Smoke test Windows Qt grid startup
        shell: powershell
        run: python -m pytest -q tests/test_grid_startup.py

      # Cache the trimmed runtime rather than the full Chocolatey installation.
      # Changing the VLC version or trimming script invalidates this cache.
      - name: Restore trimmed VLC runtime
        id: vlc-cache
        uses: actions/cache@v4
        with:
          path: .cache/vlc-runtime
          key: vlc-win64-3.0.23-${{ hashFiles('scripts/trim_vlc.ps1') }}

      - name: Prepare trimmed VLC runtime (cache miss)
        if: steps.vlc-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          choco install vlc --version=3.0.23 --no-progress -y
          .\scripts\trim_vlc.ps1 -Source "C:\Program Files\VideoLAN\VLC" -Destination ".cache\vlc-runtime"

      - name: Verify VLC runtime
        shell: powershell
        run: |
          foreach ($file in @('libvlc.dll', 'libvlccore.dll')) {
            if (!(Test-Path (Join-Path '.cache\vlc-runtime' $file))) {
              throw "VLC runtime cache is missing $file"
            }
          }

      # PyInstaller's binary cache is reusable across runner instances; the
      # application itself is still rebuilt from the checked-out source.
      - name: Restore PyInstaller binary cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pyinstaller
          key: pyinstaller-win64-py312-${{ hashFiles('requirements.txt', 'requirements-dev.txt', '.github/workflows/build.yml') }}

      - name: Build lean RelayView application
        shell: powershell
        run: >-
          python -m PyInstaller
          --noconfirm
          --windowed
          --onedir
          --name RelayView
          --icon assets/relayview.ico
          --add-data "assets;assets"
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtWebEngineQuick
          --exclude-module PySide6.QtQml
          --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtQuickWidgets
          --exclude-module PySide6.QtMultimedia
          --exclude-module PySide6.QtMultimediaWidgets
          --exclude-module PySide6.QtBluetooth
          --exclude-module PySide6.QtLocation
          --exclude-module PySide6.QtPositioning
          --exclude-module PySide6.QtSql
          --exclude-module PySide6.QtTest
          main.py

      - name: Bundle cached VLC runtime
        shell: powershell
        run: |
          Copy-Item -Path ".cache\vlc-runtime" -Destination "dist\RelayView\vlc" -Recurse -Force

      - name: Add notices
        shell: powershell
        run: |
          Copy-Item README.md "dist\RelayView\README.md"
          Copy-Item LICENSE "dist\RelayView\LICENSE"

      - name: Report unpacked size
        shell: powershell
        run: |
          $bytes = (Get-ChildItem "dist\RelayView" -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("RelayView unpacked size: {0:N1} MB" -f ($bytes / 1MB))

      - name: Install Velopack CLI
        shell: powershell
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Download previous Velopack release for delta generation
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token $env:GH_TOKEN

      - name: Create installer and update packages
        shell: powershell
        run: |
          vpk pack `
            --packId RelayView `
            --packVersion "${{ steps.version.outputs.version }}" `
            --packDir "dist\RelayView" `
            --mainExe "RelayView.exe" `
            --packTitle "RelayView" `
            --icon "assets\relayview.ico" `
            --runtime win-x64 `
            --delta BestSpeed

      - name: Upload CI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RelayView-${{ steps.version.outputs.version }}-Windows-x64
          path: Releases/RelayView-win-Setup.exe
          if-no-files-found: error

      - name: Publish Velopack GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vpk upload github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token $env:GH_TOKEN `
            --publish `
            --releaseName "RelayView v${{ steps.version.outputs.version }}" `
            --tag "v${{ steps.version.outputs.version }}"
