[project]
name = "relayview"
version = "0.4.0"
description = "A clean M3U camera stream viewer with isolated libVLC playback workers"
requires-python = ">=3.10"
dependencies = [
  "PySide6==6.11.2",
  "python-vlc==3.0.21203",
  "velopack==1.2.161",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
